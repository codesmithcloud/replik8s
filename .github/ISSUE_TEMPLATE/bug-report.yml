name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels:
- bug
- triage
projects:
- codesmithtech/2
assignees:
  - codesmithtech
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug
  - type: dropdown
    id: version
    attributes:
      label: replik8s version
      description: What version of replik8s are you running?
      options:
        - 1.0.0
      default: 0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what did you expect to happen?
      placeholder: Tell us what you saw in plain English
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      placeholder: This will be automatically formatted as a code block, so no need for backticks.
      description: |
        Paste any logs that will be useful in troubleshooting your the issue.

        Remove all sensitive information first.
      render: shell
